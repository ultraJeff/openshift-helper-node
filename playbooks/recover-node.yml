---
- name: Recover an unhealthy node
  hosts: "{{ target_node }}"
  gather_facts: false

  tasks:
    - name: Check if node is reachable
      ansible.builtin.ping:
      register: ping_result
      ignore_errors: true

    - name: Fail if node is unreachable
      ansible.builtin.fail:
        msg: "Node {{ target_node }} is unreachable via SSH. Manual intervention required."
      when: ping_result is failed

    - name: Check kubelet status
      ansible.builtin.command: sudo systemctl is-active kubelet
      register: kubelet_status
      ignore_errors: true
      changed_when: false

    - name: Check crio status
      ansible.builtin.command: sudo systemctl is-active crio
      register: crio_status
      ignore_errors: true
      changed_when: false

    - name: Restart crio if not active
      ansible.builtin.command: sudo systemctl restart crio
      when: crio_status.stdout != 'active'

    - name: Wait for crio to start
      ansible.builtin.command: sudo systemctl is-active crio
      register: crio_restarted
      retries: 6
      delay: 10
      until: crio_restarted.stdout == 'active'
      changed_when: false
      when: crio_status.stdout != 'active'

    - name: Restart kubelet if not active
      ansible.builtin.command: sudo systemctl restart kubelet
      when: kubelet_status.stdout != 'active'

    - name: Wait for kubelet to start
      ansible.builtin.command: sudo systemctl is-active kubelet
      register: kubelet_restarted
      retries: 6
      delay: 10
      until: kubelet_restarted.stdout == 'active'
      changed_when: false
      when: kubelet_status.stdout != 'active'

    - name: Display service status
      ansible.builtin.debug:
        msg: |
          Node: {{ target_node }}
          CRI-O:   {{ crio_status.stdout }} -> {{ crio_restarted.stdout | default(crio_status.stdout) }}
          Kubelet: {{ kubelet_status.stdout }} -> {{ kubelet_restarted.stdout | default(kubelet_status.stdout) }}

- name: Verify node recovery from cluster perspective
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Wait for node to become Ready
      ansible.builtin.shell: >
        oc get node {{ target_node }}
        -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
      register: node_ready
      retries: 30
      delay: 10
      until: node_ready.stdout == 'True'
      changed_when: false
      ignore_errors: true

    - name: Get final node status
      ansible.builtin.command: oc get node {{ target_node }} -o wide
      register: final_status
      changed_when: false
      ignore_errors: true

    - name: Display result
      ansible.builtin.debug:
        msg: |
          Node recovery {{ 'SUCCEEDED' if node_ready.stdout == 'True' else 'FAILED — may need drain/reboot' }}
          {{ final_status.stdout | default('') }}
